name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (e.g. abc1234)'
        required: true
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "Type DEPLOY to confirm. Aborting."
            exit 1
          fi

  deploy-prod:
    name: Production deploy
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.event.inputs.image_tag }}"
            docker pull $IMAGE
            docker stop app 2>/dev/null || true
            docker rm   app 2>/dev/null || true
            docker run -d \
              --name app \
              --restart always \
              -p 3000:3000 \
              --log-driver=awslogs \
              --log-opt awslogs-region=us-east-1 \
              --log-opt awslogs-group=/ec2/devops-assignment/app \
              --log-opt awslogs-stream=$(curl -s http://169.254.169.254/latest/meta-data/instance-id) \
              -e NODE_ENV=production \
              $IMAGE

      - name: Notify Slack on success
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"text": "✅ Production deploy succeeded — tag `${{ github.event.inputs.image_tag }}`"}